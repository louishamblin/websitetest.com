<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Careers | Lloyd & Co. Financial Planning</title>

<style>
:root{ --green-900:#1f4f49; --green-850:#1b4742; --cream:#f5efe3; --line:rgba(0,0,0,.10); --shadow:0 18px 50px rgba(0,0,0,.18); }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--cream); color:#0c2f2b; }
a{ color:inherit; text-decoration:none; }
.container{ width:min(1200px,92vw); margin:0 auto; }

header{ background:linear-gradient(0deg,var(--green-850),var(--green-900)); color:#fff; position:sticky; top:0; z-index:50; box-shadow:0 10px 24px rgba(0,0,0,.18); }
.topbar{ display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; padding:16px 0; }
.brand img{ height:44px; border-radius:6px; }

.nav{ list-style:none; display:flex; gap:36px; padding:0; margin:0; justify-content:center; font-weight:800; align-items:center; }
.nav a{ color:#fff; padding:8px 12px; border-radius:999px; opacity:.95; white-space:nowrap; }
.nav a:hover{ background:rgba(255,255,255,.15); }
.dropdown{ position:relative; }
.dropdown-menu{
  position:absolute; top:calc(100% + 12px); left:50%;
  transform:translateX(-50%) translateY(-8px);
  min-width:280px;
  list-style:none; margin:0; padding:12px;
  background:linear-gradient(0deg,#1b4742,#1f4f49);
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px; box-shadow:0 18px 40px rgba(0,0,0,.35);
  opacity:0; pointer-events:none;
  transition: opacity .18s ease, transform .18s ease;
  z-index:200;
}
.dropdown-menu li{ margin:4px 0; }
.dropdown-menu a{ display:block; padding:10px 14px; border-radius:10px; font-weight:900; opacity:.95; }
.dropdown-menu a:hover{ background:rgba(255,255,255,.15); opacity:1; }
.dropdown:hover .dropdown-menu{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
.dropdown-menu::before{
  content:""; position:absolute; top:-8px; left:50%;
  width:14px; height:14px; transform:translateX(-50%) rotate(45deg);
  background:#1f4f49;
  border-left:1px solid rgba(255,255,255,.14);
  border-top:1px solid rgba(255,255,255,.14);
}

.actions{ display:flex; justify-content:flex-end; }
.btn-login{ display:inline-block; border:2px solid rgba(255,255,255,.6); color:#fff; border-radius:999px; padding:10px 22px; font-weight:900; }
.btn-login:hover{ border-color:#fff; }

.pagehead{ background:rgba(255,255,255,.55); border-bottom:1px solid var(--line); }
.pagehead-inner{ padding:18px 0; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.page-title{ font-weight:1000; font-size:1.25rem; color:var(--green-900); }
.breadcrumb{ font-weight:800; font-size:.92rem; opacity:.75; }
.breadcrumb span{ opacity:.65; }

.section{ padding:44px 0 80px; }
.card{
  background: rgba(255,255,255,.75);
  border:1px solid rgba(0,0,0,.08);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:26px;
  text-align:center;
}
.h1{
  margin:0 0 10px;
  font-weight:1000;
  color:var(--green-900);
  font-size: clamp(2rem,3.2vw,3rem);
}
.message{
  margin:0;
  line-height:1.8;
  font-weight:750;
  color:rgba(31,79,73,.95);
  font-size: 1.1rem;
}

@media (max-width:980px){
  .topbar{ grid-template-columns:1fr auto; grid-template-areas:"brand actions" "nav nav"; }
  .brand{ grid-area:brand; } .actions{ grid-area:actions; } nav{ grid-area:nav; }
  .nav{ gap:14px; justify-content:flex-start; overflow:auto; padding-bottom:6px; }
  .pagehead-inner{ flex-direction:column; align-items:flex-start; }
}
</style>
</head>
<body>

<header>
  <div class="container topbar">
    <div class="brand"><a href="index.html"><img src="fpweb.png" alt="Lloyd & Co"></a></div>
    <nav>
      <ul class="nav">
        <li class="dropdown">
          <a href="aboutus.html">About Us</a>
          <ul class="dropdown-menu">
            <li><a href="aboutus.html">About Lloyd &amp; Co</a></li>
            <li><a href="ourteam.html">Our Team</a></li>
            <li><a href="technology.html">Our Technology</a></li>
            <li><a href="careers.html">Careers at Lloyd &amp; Co</a></li>
            <li><a href="contact.html">Contact Us</a></li>
          </ul>
        </li>
        <li><a href="journey.html">The Journey</a></li>
        <li><a href="mind.html">The Mind</a></li>
        <li><a href="money.html">The Money</a></li>
      </ul>
    </nav>
    <div class="actions"><a class="btn-login" href="clientlogin.html">Client Login</a></div>
  </div>
</header>

<div class="pagehead">
  <div class="container pagehead-inner">
    <div class="page-title">Careers at Lloyd &amp; Co</div>
    <div class="breadcrumb"><span>You are here:</span> Home &nbsp;›&nbsp; About Us &nbsp;›&nbsp; <strong>Careers</strong></div>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="card">
      <div class="h1">Careers</div>
      <p class="message">We currently have no job vacancies available.</p>
    </div>
  </div>
</section>

</body>
</html>
