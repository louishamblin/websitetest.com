<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Louis — Coming Soon</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:32px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1000px 600px at 20% 20%, rgba(255, 77, 77, 0.25), transparent 60%),
        radial-gradient(900px 500px at 80% 30%, rgba(37, 99, 235, 0.22), transparent 55%),
        linear-gradient(135deg, #0b1220, #121a2b);
      color:#0f172a;
    }

    .container{
      position:relative;
      width:760px;
      max-width:95vw;
      filter: drop-shadow(0 22px 45px rgba(0,0,0,0.35));
    }

    .container img{
      width:100%;
      display:block;
    }

    /* CONTENT POSITIONED ON SIGN */
    .card-content{
      position:absolute;
      left:50%;
      top:70%;              /* Adjusted lower */
      transform:translate(-50%, -50%);
      width:60%;            /* Pulled inward from fingers */
      text-align:center;
      color:#0f172a;
      padding:10px 18px;
    }

    .badge{
      display:inline-block;
      padding:6px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.4px;
      background: rgba(208,0,0,0.12);
      border: 1px solid rgba(208,0,0,0.25);
      color:#b10000;
      margin-bottom:12px;
    }

    h1{
      margin:0 0 8px;
      font-size:28px;
      letter-spacing:-0.4px;
    }

    .subtitle{
      margin:0 auto 16px;
      font-size:14px;
      color:#334155;
      line-height:1.35;
      max-width:320px;
    }

    .list{
      margin:14px auto 18px;
      padding:0;
      list-style:none;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      font-size:14px;
    }

    .pill{
      padding:8px 12px;
      border-radius:999px;
      background:#f1f5f9;
      border:1px solid #e2e8f0;
      font-weight:600;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:6px;
    }

    .btn{
      display:inline-block;
      padding:10px 16px;
      border-radius:12px;
      font-weight:700;
      text-decoration:none;
      font-size:14px;
      transition: transform 0.15s ease, opacity 0.15s ease;
      user-select:none;
    }

    .btn:hover{
      transform: translateY(-2px);
      opacity:0.95;
    }

    .btn-primary{
      background: linear-gradient(135deg, #d00000, #ff4d4d);
      color:white;
      box-shadow: 0 10px 20px rgba(208,0,0,0.25);
    }

    .btn-ghost{
      background:white;
      color:#0f172a;
      border:1px solid #e2e8f0;
    }

    .fineprint{
      margin-top:14px;
      font-size:12px;
      color:#64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="avatar.png" alt="Louis holding sign">

    <div class="card-content">
      <div class="badge">COMING SOON</div>

      <h1>Louis Hamblin</h1>

      <p class="subtitle">
        A professional holding page while I build something awesome.
        Check back soon.
      </p>

      <ul class="list">
        <li class="pill">⚽ Football</li>
        <li class="pill">🔴 Liverpool FC</li>
        <li class="pill">💻 Tech</li>
      </ul>

      <div class="actions">
        <a class="btn btn-primary" href="https://www.liverpoolfc.com" target="_blank">
          Liverpool FC →
        </a>
        <a class="btn btn-ghost" href="#" onclick="alert('Thanks for visiting!'); return false;">
          Contact
        </a>
      </div>

      <div class="fineprint">
        © <span id="year"></span> Louis. All rights reserved.
      </div>
    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
