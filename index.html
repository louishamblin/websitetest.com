<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Louis — Coming Soon</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1000px 600px at 20% 20%, rgba(255, 77, 77, 0.25), transparent 60%),
        radial-gradient(900px 500px at 80% 30%, rgba(37, 99, 235, 0.22), transparent 55%),
        linear-gradient(135deg, #0b1220, #121a2b);
      color:#0f172a;
    }

    .container{
      position:relative;
      width:min(760px, 95vw);
      filter: drop-shadow(0 22px 45px rgba(0,0,0,0.35));
    }

    .container img{
      width:100%;
      display:block;
      height:auto;
    }

    /* CONTENT ON SIGN (responsive typography + spacing) */
    .card-content{
      position:absolute;
      left:50%;
      top:70%;
      transform:translate(-50%, -50%);
      width:60%;
      text-align:center;
      color:#0f172a;
      padding:10px 16px;
    }

    .badge{
      display:inline-block;
      padding:6px 12px;
      border-radius:999px;
      font-size: clamp(10px, 2.6vw, 12px);
      font-weight:700;
      letter-spacing:0.4px;
      background: rgba(208,0,0,0.12);
      border: 1px solid rgba(208,0,0,0.25);
      color:#b10000;
      margin-bottom:10px;
      white-space: nowrap;
    }

    h1{
      margin:0 0 8px;
      font-size: clamp(18px, 4.6vw, 28px);
      letter-spacing:-0.4px;
      line-height:1.05;
    }

    .subtitle{
      margin:0 auto 14px;
      font-size: clamp(11px, 3.1vw, 14px);
      color:#334155;
      line-height:1.25;
      max-width: 34ch;
    }

    .list{
      margin: 10px auto 14px;
      padding:0;
      list-style:none;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:8px;
      font-size: clamp(11px, 3.0vw, 14px);
    }

    .pill{
      padding:7px 10px;
      border-radius:999px;
      background:#f1f5f9;
      border:1px solid #e2e8f0;
      font-weight:600;
      white-space: nowrap;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:6px;
    }

    .btn{
      display:inline-block;
      padding: 9px 14px;
      border-radius:12px;
      font-weight:700;
      text-decoration:none;
      font-size: clamp(11px, 3.0vw, 14px);
      transition: transform 0.15s ease, opacity 0.15s ease;
      user-select:none;
      white-space: nowrap;
    }

    .btn:hover{
      transform: translateY(-2px);
      opacity:0.95;
    }

    .btn-primary{
      background: linear-gradient(135deg, #d00000, #ff4d4d);
      color:white;
      box-shadow: 0 10px 20px rgba(208,0,0,0.25);
    }

    .btn-ghost{
      background:white;
      color:#0f172a;
      border:1px solid #e2e8f0;
    }

    .fineprint{
      margin-top:12px;
      font-size: clamp(10px, 2.6vw, 12px);
      color:#64748b;
    }

    /* MOBILE TUNING */
    @media (max-width: 520px){
      .card-content{
        top: 72%;      /* move slightly down/up for your image on mobile */
        width: 66%;    /* bring text inward so it avoids fingers */
        padding: 8px 12px;
      }

      .subtitle{
        max-width: 30ch;
        margin-bottom: 12px;
      }

      .list{
        gap:6px;
        margin-bottom: 12px;
      }

      .pill{
        padding:6px 9px;
      }

      .actions{
        gap:8px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="avatar.png" alt="Louis holding sign">

    <div class="card-content">
      <div class="badge">COMING SOON</div>

      <h1>Louis Hamblin</h1>

      <p class="subtitle">
        A professional holding page while I build something awesome.
        Check back soon.
      </p>

      <ul class="list">
        <li class="pill">⚽ Football</li>
        <li class="pill">🔴 Liverpool FC</li>
        <li class="pill">💻 Tech</li>
      </ul>

      <div class="actions">
        <a class="btn btn-primary" href="https://www.liverpoolfc.com" target="_blank" rel="noopener">
          Liverpool FC →
        </a>
        <a class="btn btn-ghost" href="#" onclick="alert('Thanks for visiting!'); return false;">
          Contact
        </a>
      </div>

      <div class="fineprint">
        © <span id="year"></span> Louis. All rights reserved.
      </div>
    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
