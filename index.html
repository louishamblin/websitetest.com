<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Louis — Coming Soon</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:
    radial-gradient(1000px 600px at 20% 20%, rgba(255, 77, 77, 0.25), transparent 60%),
    radial-gradient(900px 500px at 80% 30%, rgba(37, 99, 235, 0.22), transparent 55%),
    linear-gradient(135deg, #0b1220, #121a2b);
}

.container{
  position:relative;
  width:min(760px, 95vw);
  filter: drop-shadow(0 22px 45px rgba(0,0,0,0.35));
}

.container img{
  width:100%;
  display:block;
}

/* COMING SOON ABOVE HEAD */
.top-badge{
  position:absolute;
  top:-40px;
  left:50%;
  transform:translateX(-50%);
  background: linear-gradient(135deg,#d00000,#ff4d4d);
  color:white;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
  letter-spacing:0.5px;
  box-shadow:0 10px 25px rgba(208,0,0,0.4);
}

/* CONTENT ON SIGN */
.card-content{
  position:absolute;
  left:50%;
  top:74%;   /* lowered so name sits on card */
  transform:translate(-50%, -50%);
  width:60%;
  text-align:center;
  color:#0f172a;
}

h1{
  margin:0 0 10px;
  font-size: clamp(20px, 4.5vw, 28px);
}

.subtitle{
  font-size: clamp(12px, 3vw, 14px);
  color:#334155;
  line-height:1.3;
  margin-bottom:14px;
}

.list{
  list-style:none;
  padding:0;
  margin:12px 0;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  font-size: clamp(11px, 3vw, 14px);
}

.pill{
  padding:6px 10px;
  border-radius:999px;
  background:#f1f5f9;
  border:1px solid #e2e8f0;
  font-weight:600;
}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:10px 16px;
  border-radius:12px;
  background:#111827;
  color:white;
  text-decoration:none;
  font-weight:700;
  font-size: clamp(11px, 3vw, 14px);
  transition:0.2s ease;
}

.btn:hover{
  transform:translateY(-2px);
  opacity:0.9;
}

/* MOBILE ADJUSTMENTS */
@media (max-width:520px){
  .card-content{
    top:76%;
    width:66%;
  }

  .top-badge{
    top:-30px;
    font-size:12px;
    padding:8px 14px;
  }
}
</style>
</head>

<body>
  <div class="container">

    <div class="top-badge">
      COMING SOON
    </div>

    <img src="avatar.png" alt="Louis holding sign">

    <div class="card-content">
      <h1>Louis Hamblin</h1>

      <p class="subtitle">
        A professional holding page while I build something awesome.
      </p>

      <ul class="list">
        <li class="pill">⚽ Football</li>
        <li class="pill">🔴 Liverpool FC</li>
        <li class="pill">💻 Tech</li>
      </ul>

      <a class="btn" href="https://www.liverpoolfc.com" target="_blank">
        Liverpool FC →
      </a>
    </div>

  </div>
</body>
</html>
