<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Mind | Lloyd & Co. Financial Planning</title>

<style>
:root{ --green-900:#1f4f49; --green-850:#1b4742; --cream:#f5efe3; --shadow:0 18px 50px rgba(0,0,0,.18); }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--cream); color:#0c2f2b; }
a{ color:inherit; text-decoration:none; }
.container{ width:min(1200px,92vw); margin:0 auto; }

header{
  background: linear-gradient(0deg, var(--green-850), var(--green-900));
  color:#fff;
  position:sticky; top:0; z-index:50;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
}
.topbar{ display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; padding:16px 0; }
.brand img{ height:44px; border-radius:6px; }
nav ul{ list-style:none; display:flex; gap:36px; padding:0; margin:0; justify-content:center; font-weight:800; }
nav a{ color:#fff; padding:8px 12px; border-radius:999px; opacity:.95; }
nav a:hover{ background:rgba(255,255,255,.15); }
.actions{ display:flex; justify-content:flex-end; }
.btn-login{ border:2px solid rgba(255,255,255,.6); color:#fff; padding:10px 22px; border-radius:999px; font-weight:900; }
.btn-login:hover{ border-color:#fff; }

.main{ padding: 60px 0 90px; }
.card{
  width:min(1100px, 92vw);
  margin:0 auto;
  background: rgba(255,255,255,.75);
  border:1px solid rgba(0,0,0,.08);
  border-radius:22px;
  box-shadow: var(--shadow);
  padding: 30px;
}
h1{ margin:0 0 10px; color:var(--green-900); font-weight:1000; font-size: clamp(2rem,3.2vw,3rem); }
p{ margin:0; line-height:1.8; font-weight:650; color:rgba(31,79,73,.95); }

@media (max-width:980px){
  .topbar{ grid-template-columns:1fr auto; grid-template-areas:"brand actions" "nav nav"; }
  .brand{ grid-area:brand; } .actions{ grid-area:actions; } nav{ grid-area:nav; }
  nav ul{ gap:14px; justify-content:flex-start; overflow:auto; padding-bottom:6px; }
}
</style>
</head>
<body>

<header>
  <div class="container topbar">
    <div class="brand"><a href="index.html"><img src="fpweb.png" alt="Lloyd & Co"></a></div>
    <nav>
      <ul>
        <li><a href="aboutus.html">About Us</a></li>
        <li><a href="journey.html">The Journey</a></li>
        <li><a href="mind.html">The Mind</a></li>
        <li><a href="money.html">The Money</a></li>
      </ul>
    </nav>
    <div class="actions"><a class="btn-login" href="clientlogin.html">Client Login</a></div>
  </div>
</header>

<section class="main">
  <div class="card">
    <h1>The Mind</h1>
    <p>
      Add your “Mindset &amp; Behaviour” content here. If you want, upload the Canva/PDF page for The Mind
      and I’ll match it exactly like we did with the login.
    </p>
  </div>
</section>

</body>
</html>
